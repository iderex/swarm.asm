# Mutation testing for the reference oracle, on a schedule and on demand.
#
# The oracle in tests/Swarm.Oracle is the ground truth every kernel correctness
# claim is measured against, so the question this answers is whether the tests
# AROUND that reference would notice it changing. A mutation run is the only
# thing that asks it.
#
# NOT A PULL-REQUEST GATE, and it must not become one. The run drives the whole
# harness once for the initial pass, once for coverage capture and then per
# mutant, which is minutes; the issue that asked for this (#150) says in its
# own scope that a mutation run is too slow and too noisy to gate a pull
# request on. It also does not fail on a score: Stryker's break threshold is
# left at its default of zero, so this job goes red for a tool or harness
# failure and never for a survivor. Triaging survivors is #151 and is a
# person's judgement, not a threshold.
#
# Internal only. Stryker.NET is a local tool restored from the pinned manifest
# in .config/dotnet-tools.json; nothing is uploaded anywhere and no external
# review or quality service is involved, which a conformance test refuses.
#
# THE RUNNER IS THE LOAD-BEARING SETTING. This harness runs on
# Microsoft.Testing.Platform because VSTest spawns a freshly built
# testhost.exe, which Device Guard blocks on the development machine.
# Stryker's default runner is VSTest; tests/Swarm.Tests/stryker-config.json
# selects the MTP runner instead. That runner is a preview in 4.16.0 and says
# so on every run.

name: Mutation test (oracle)

on:
  schedule:
    # Weekly, Tuesday 04:43 UTC. Off the hour, and off the parser fuzz's day,
    # so the two long jobs do not queue behind each other.
    - cron: "43 4 * * 2"
  workflow_dispatch:

# Fail closed: no ambient token scope at the top level; the job re-grants the
# minimum it needs.
permissions: {}

# One run at a time, and a new one never kills a run in flight - a mutation run
# cancelled at 90% has told nobody anything.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  mutate:
    name: mutate the oracle
    runs-on: windows-latest
    # The measured run on the reference machine is about five minutes. This
    # bound is the runaway catch, not the expected duration.
    #
    # WHAT THE HOSTED RUNNER ACTUALLY SPENDS IS VARIABLE, AND THE SPREAD IS
    # WIDER THAN THIS BOUND SUGGESTS (#295). The mutate step measured, with
    # the tree each row ran on:
    #
    #   run 32667583739  14m47s  completed   f3306e1e  (pre #293)
    #   run 32812099051  20m13s  completed   8dbed8dd  (schedule)
    #   run 32805302524  44m18s  killed by this bound   8dbed8dd
    #   run 32854516422   1m49s  aborted, over 50% failing   8dbed8dd
    #   run 32858859974  44m49s  killed by this bound   f5b28e56  (on main)
    #   run 33062644118  21m43s  completed   0fd5cfb8  (on main)
    #
    # THE TREE COLUMN IS NEW AND IT CORRECTS THIS COMMENT. What stood here
    # said all but the first row ran on 8dbed8dd and that "20m13s and 44m49s
    # are the same bytes". Three of them did; 32858859974 ran on f5b28e56,
    # which is 8dbed8dd plus two Dependabot bumps to scorecard.yml and
    # zizmor.yml and nothing this job reads. So the substance survives and the
    # pair proving it is a different one: 20m13s and 44m18s are the same
    # bytes, and no change in the work explains the spread between them.
    #
    #   gh api repos/iderex/swarm.asm/actions/runs/$r --jq .head_sha
    #   git rev-parse $head_sha^{tree}
    #
    # A DISPATCH DOES FINISH, AND THIS COMMENT SAID A READER SHOULD NOT EXPECT
    # ONE TO. The last row is a dispatch on main taken on 2026-08-27, the
    # first since the harness run below was inserted. The job ran 23m44s of
    # this 45 and ended on its own steps rather than on the bound; it tested
    # 110 mutants, published its report, and went red on the verdict refusal
    # (#294) rather than on time.
    #
    # The bound is still a number nobody has measured the right value for.
    # Neither killed run says how much longer it needed, so raising it is a
    # guess about cost rather than a size read off a number, and lowering it
    # would kill the 20m13s shape as well. Three completions between 14m47s
    # and 21m43s against two kills at 44m are two populations, and nothing
    # here says which one the next run is drawn from.
    #
    # THE BOUND IS ON THE JOB AND EVERY FIGURE ABOVE IS ON ONE STEP, so the
    # step's budget is this number minus whatever runs before it. That was a
    # rounding error when the first rows were taken and it is not one now. The
    # preamble, job start to the mutate step's start:
    #
    #   gh api repos/iderex/swarm.asm/actions/runs/$r/jobs \
    #     --jq '.jobs[] | "\(.started_at)", (.steps[] | "\(.name) \(.started_at)")'
    #   32667583739  38s   32812099051  37s   32805302524  49s
    #   32858859974  26s   33062644118  115s
    #
    # The last of those is the only row carrying the full harness run inserted
    # ahead of the mutate step (#297); the rows above it predate that step. It
    # cost 93s of the 115s, inside the 88s to 104s ci.yml's "Test (conformance
    # harness)" spends on the same command and the same runner image. So the
    # mutate step gets about 43m of this bound today rather than 45.
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # The native kernel must actually load. A test that skipped because the
      # DLL was missing kills no mutant, and the survivor it leaves behind
      # would read as a gap in the oracle's tests rather than as a skipped run.
      SWARM_REQUIRE_NATIVE: "1"
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "9.0.x"

      - name: Bootstrap the pinned assembler (SHA-256-verified)
        run: ./tools/get-fasm.ps1

      - name: Assemble
        run: ./build.ps1

      - name: Restore the pinned mutation tool
        run: dotnet tool restore

      - name: Run the harness once, before Stryker drives it
        # THE NAMES ARE THE POINT, and Stryker does not print them. Run
        # 32854516422 aborted on "Initial testrun has more than 50% failing
        # tests" and named exactly one test in the whole job log, while the
        # class it named holds two of the suite's tests - so the printed name
        # cannot be what tripped the threshold, and which tests did is
        # recoverable from nothing. Stryker aborts before it writes a report,
        # so there is no artifact to read either.
        #
        # This is the same suite the mutate step is about to drive, run by the
        # test platform, which names every failure. It also separates the two
        # candidates: green here and an abort below is Stryker's own build and
        # sandbox, red here is the harness on this runner. Either reading is
        # one this job could not produce before.
        #
        # It fails the job, deliberately. A mutation score measured against a
        # red suite means nothing, so this is a harness failure in the sense
        # the mutate step's own message already uses.
        #
        # WHAT IT COSTS COMES OUT OF THE JOB'S BOUND, not out of the mutate
        # step's spread, and the note that added this step charged it against
        # the wrong one. `timeout-minutes` sits on the job, so this run and the
        # mutate step share the 45 minutes between them. Measured on the same
        # command and runner image in ci.yml's "Test (conformance harness)"
        # over its five most recent runs: 90s, 88s, 96s, 104s, 96s. The bound's
        # own comment above carries what that leaves the mutate step.
        run: dotnet test tests/Swarm.Tests/Swarm.Tests.csproj -c Release --nologo -p:RestoreLockedMode=true

      - name: Mutate the oracle
        id: mutate
        working-directory: tests/Swarm.Tests
        run: |
          dotnet dotnet-stryker --output "$env:GITHUB_WORKSPACE/build/mutation"
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet-stryker failed (exit $LASTEXITCODE) - this job fails on a tool or harness failure, never on a mutation score"
          }

      - name: Account for the report
        # THERE IS NO SUCH THING AS A PARTIAL REPORT HERE, and the step below
        # used to promise one. Stryker writes its report when a run ENDS, so a
        # run that did not finish mutating leaves the output directory empty:
        # run 32805302524 was killed by the bound above and run 32854516422
        # aborted on its initial test run, and both left nought artifacts with
        # the upload step red on `if-no-files-found: error`. The absence is
        # inevitable in that shape, so it is explained in the run's own output
        # rather than reported as an upload failure.
        #
        # It still fails closed where the absence is a real defect: mutating
        # reporting success and writing no report anyway, and an absence with
        # no conclusion to explain it. Those two branches and this one were
        # each made to fire before the script was trusted.
        id: report
        if: always()
        env:
          MUTATE_CONCLUSION: ${{ steps.mutate.conclusion }}
        run: >
          ./tools/mutation-report-gate.ps1
          -MutateConclusion "$env:MUTATE_CONCLUSION"
          -ReportDir "$env:GITHUB_WORKSPACE/build/mutation/reports"

      - name: Publish the report
        # Always, because a run that finished mutating and then failed
        # downstream still has a report a reader needs, and re-running to see
        # it costs the same minutes again. The accounting step above is what
        # decides whether one exists; `if-no-files-found: error` stays as the
        # second half of that judgement rather than as the whole of it.
        if: always() && steps.report.outputs.have == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report
          path: build/mutation/reports/
          if-no-files-found: error
          retention-days: 90

      - name: Refuse the verdicts that cannot be true
        # THIS REPORT PUBLISHES KILLS THAT CANNOT HAVE HAPPENED (#294). Run
        # 32667583739 reports six `>>`-to-`>>>` mutants on `ulong` operands as
        # Killed, each by the same 274 tests, while a seventh of exactly that
        # shape one line away is reported Survived in the same run. For an
        # unsigned operand the two operators are the same logical shift, so no
        # program can distinguish them and no test can fail on one.
        #
        # tools/check-mutation-verdicts.ps1 refuses that half and prints what
        # share of the report's killedBy ids resolve to a test the report
        # declares. tools/mutation-test.ps1 has called it since #298 and this
        # job did not, so the hosted route published unread verdicts while the
        # opt-in route refused them. Both routes read the same report the same
        # way now.
        #
        # IT RUNS AFTER THE UPLOAD, DELIBERATELY. What is refused is the run,
        # not the evidence. The mechanism behind the false verdicts is still
        # unidentified and every reading that got this far was made against a
        # downloaded report, so the artifact is the one thing the next attempt
        # has to work from. Ordering the refusal last means the artifact's
        # survival does not depend on the publish step keeping `always()`. The
        # opt-in route behaves the same way: it throws and leaves the report on
        # disk.
        #
        # An absent JSON report under a present reports directory is a throw
        # rather than a pass. Json is one of the three reporters
        # tests/Swarm.Tests/stryker-config.json selects, so its absence beside
        # other report files is the reporter having stopped writing, which is a
        # tool failure and not an empty result.
        if: always() && steps.report.outputs.have == 'true'
        run: |
          ./tools/check-mutation-verdicts.ps1 -ReportPath "$env:GITHUB_WORKSPACE/build/mutation/reports/mutation-report.json"
          if ($LASTEXITCODE -ne 0) {
            throw "the report carries a verdict that cannot be true (exit $LASTEXITCODE) - see the refusals above (#294)"
          }

name: unicode-guard

on:
  # Every branch and every PR: the guard is a cheap read-only scan and must cover
  # any future release branch too, not just main.
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Read-only: the guard only greps the tracked tree, it never writes.
permissions:
  contents: read

# Cancel a superseded run on the same ref so a new push / PR update does not
# queue behind an obsolete check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bidi:
    name: Reject Trojan Source Unicode
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes via git, so do not persist the GITHUB_TOKEN in .git/config.
          persist-credentials: false
      - name: Reject bidirectional / invisible Unicode control characters
        run: |
          # Trojan Source (CVE-2021-42574): bidirectional overrides/isolates/marks and
          # zero-width characters can make source render differently from how it executes,
          # hiding malicious logic from a human reviewer. Reject them in the source and
          # tooling tree -- the generalization of the machine constraint that every .ps1
          # file is ASCII-only (Windows PowerShell 5.1 parses an unsigned, BOM-less
          # script as ANSI; a stray em-dash or bidi mark breaks the parse). (*UTF) enables
          # PCRE2 UTF-8 so \x{...} matches codepoints, not raw bytes; -I skips binary
          # files. Em dashes, accents, and other benign non-ASCII in docs are not in the
          # set and are out of scope for this scan. U+2060 (word joiner) is included as
          # an invisible control with no legitimate use in source or tooling. U+FEFF
          # (BOM) is deliberately NOT listed: it is not part of the Trojan Source
          # bidi-reordering attack and banning it outright would false-positive on any
          # legitimately BOM-prefixed file.
          pattern='(*UTF)[\x{202A}-\x{202E}\x{2066}-\x{2069}\x{200E}\x{200F}\x{061C}\x{200B}-\x{200D}\x{2060}]'
          # Scope: src/** (the engine), tools/** (the FASM bootstrap + build helpers),
          # every *.ps1 (build.ps1 at the root plus anything under tools/), .github/**
          # (the workflows themselves), and tests/** (the C# harness, which compiles and
          # runs and is where the conformance gates live) -- source and tooling, not
          # prose docs. docs/** stays out on purpose: the README carries intentional
          # emoji and em-dashes, and while neither is in the character set above, the
          # roots listed here are the ones where a rendered/executed mismatch changes
          # what a machine does rather than what a reader sees.
          # UnicodeGuardScopeTests in the C# harness refuses a narrowing of this list.
          # git grep: 0 = a match was found, 1 = clean, >=2 = scanner/tooling error. Capture
          # the code (the `|| rc=$?` keeps `set -e` from aborting on the clean exit-1) and
          # FAIL CLOSED on any error rather than mistaking a broken scanner for a clean tree.
          rc=0
          git grep -nIP "$pattern" -- src tools '*.ps1' .github tests || rc=$?
          case "$rc" in
            0)
              echo "::error::Dangerous bidirectional/invisible Unicode found (Trojan Source, CVE-2021-42574). Remove these control characters."
              exit 1
              ;;
            1)
              echo "No bidirectional or invisible Unicode control characters found in src/, tools/, *.ps1, .github/, or tests/."
              ;;
            *)
              echo "::error::unicode-guard scanner error (git grep exit $rc) -- failing closed instead of assuming the tree is clean."
              exit 1
              ;;
          esac

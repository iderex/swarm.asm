# CI - fast, fail-closed pull-request gate.
#
# Runs only on pull requests to `main`, so the mainline scaffolding push does
# not trigger it. Every PR must assemble, stay inside the size budget,
# smoke-run, pass the .NET conformance harness (locked-mode restore), and be
# Prettier-clean before it can merge.
#
# step-security/harden-runner is deliberately absent: it does not support
# Windows runners, and this build needs Windows to execute the produced PE.

name: CI

on:
  pull_request:
    branches: [main]

# One in-flight run per PR; a newer push cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Fail closed: no ambient token scope at the top level; the job re-grants the
# minimum it needs.
permissions: {}

jobs:
  build:
    # The job name is the required-check context in the branch ruleset - keep
    # it stable.
    name: build
    runs-on: windows-latest
    # A hung smoke-run or test host fails in minutes, not the 360-minute
    # GitHub default.
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # CI has no application-control policy, so the native DLL must actually
      # load - the ABI conformance test is required here, never skipped.
      SWARM_REQUIRE_NATIVE: "1"
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # Two, and neither is spare. 9.0.x carries the runtime the harness
          # targets; 10.0.x carries the SDK whose `dotnet test` reads the
          # global.json opt-in, which xunit.v3 4.x requires because it ships
          # only the platform runner. The 10 SDK is on the runner image today
          # and this asks for it rather than inheriting it, so the day the
          # image changes the job says what is missing (#343).
          dotnet-version: |
            9.0.x
            10.0.x
          # Keyed on the committed lock file; restore runs in locked mode
          # below, so the cache can never mask a drifted dependency.
          cache: true
          cache-dependency-path: tests/Swarm.Tests/packages.lock.json

      - name: Restore the verified assembler archive
        # tools/get-fasm.ps1 keeps the archive it verified in this directory,
        # so a hit here never contacts the origin server (#344). This buys
        # resilience, not time. By the step records: on run 34046430460 the
        # miss cost 1 s to look up and 2 s to save, while the download it
        # removes is under 1 s of the 2 s bootstrap step, whose host start,
        # hash and unpack a hit still pays; on run 34058810136, the first
        # hosted hit, the restore took 2 s for the 1 MB entry, the bootstrap
        # 1 s with the origin never contacted, and the post step saved
        # nothing. The key is derived from the script that carries the pin: a
        # bumped version or hash is a new key, with no second copy of the hash
        # here to drift. What this restores is NOT trusted on its key: the
        # script compares the restored archive against the pinned SHA-256
        # before unpacking, exactly as it does a download.
        #
        # No restore-keys, on purpose. The script refuses a restored archive
        # whose hash does not match and does not download in its place, so a
        # prefix match after a pin bump would be a red run, not a re-fetch.
        # The same refusal is the way a bad entry ever shows up: it stays red
        # until the entry is deleted (`gh cache delete`) or the script changes.
        #
        # WHEN IT HELPS. A pull-request run reads its own scope first, so a
        # re-push with the script unchanged hits, then main's; it saves only
        # into its own scope. Main's entry is written by seed-fasm-cache.yml
        # on the push to main that changes the script, so the entry exists
        # the moment its key does (#346), and by any scheduled job that
        # bootstraps the assembler and ends green - parser-fuzz.yml weekly,
        # mutation.yml only on a week its verdict passes. Until the seed has
        # run green for the script at main, every pull request's first run
        # still downloads, and a vendor outage fails it exactly as before. An
        # entry nothing has restored for seven days is evicted; the scheduled
        # restores keep it warm while they run each week, so it goes cold
        # when they miss one.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/fasm-archive
          key: fasm-archive-${{ hashFiles('tools/get-fasm.ps1') }}

      - name: Bootstrap the pinned assembler (SHA-256-verified)
        run: ./tools/get-fasm.ps1

      - name: Assemble
        # -Debug adds build/debug/, assembled with SWARM_DEBUG so the platform
        # layer's debug-only assertions are in the stream. It changes nothing
        # about the release artifacts every step below uses. Assembling it here
        # is what stops that path from rotting unnoticed: a debug-only guard
        # nothing ever builds is a guard that has stopped existing.
        run: ./build.ps1 -Debug

      - name: Report the size budget
        # The conformance test enforces the same bound; this step makes the
        # number visible on every PR without opening the test log. The 65536
        # literal must track SizeBudgetBytes in ConformanceTests.cs.
        run: |
          $size = (Get-Item .\build\swarm.exe).Length
          Write-Host "swarm.exe: $size bytes of the 65536-byte budget ($([math]::Round(100 * $size / 65536, 1))%)"
          if ($size -gt 65536) { throw "swarm.exe is $size bytes - over the 64 KiB budget" }

      - name: Smoke-run
        # swarm.exe is a GUI-subsystem PE: -smoke renders a fixed number of
        # frames and exits, which is what a smoke gate needs. Start-Process
        # -Wait is required for a reliable exit code from a GUI process.
        run: |
          $p = Start-Process -FilePath .\build\swarm.exe -ArgumentList '-smoke' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "swarm.exe -smoke exited with $($p.ExitCode)" }

      - name: Smoke-run the debug build
        # The non-vacuity control for the debug-only seam assertion. A guard
        # that fires on a correct build is worse than none, and the only way to
        # know it does not is to run a build that carries it. This exits 0
        # exactly when every kernel core was entered under SEAM_MXCSR.
        run: |
          $p = Start-Process -FilePath .\build\debug\swarm.exe -ArgumentList '-smoke' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "debug swarm.exe -smoke exited with $($p.ExitCode)" }

      - name: Smoke-run with a preset on the command line
        # The platform half of the preset surface. The accepted fixture has to
        # reach the live loop and the refused one has to stop before it, so
        # both directions are read rather than the happy one alone: an exe that
        # ignored the file it was given would pass a one-sided check.
        # PresetFixtureTests pins what makes each fixture what it is; this step
        # only reads what the exe did with them.
        #
        # The two synthesized cases cover the reader's own limits rather than
        # the grammar's - a name that opens nothing, and one byte past the
        # 8192-byte cap. Neither is worth committing as a file.
        run: |
          function Invoke-Preset($file, $expected, $what) {
            $p = Start-Process -FilePath .\build\swarm.exe -ArgumentList "-smoke $file" -Wait -PassThru
            if ($p.ExitCode -ne $expected) {
              throw "$what : swarm.exe -smoke $file exited with $($p.ExitCode), expected $expected"
            }
            Write-Host "$what : exit $($p.ExitCode)"
          }
          $accepted = 'tests/fixtures/preset/accepted.txt'
          Invoke-Preset $accepted 0 'accepted fixture'
          Invoke-Preset 'tests/fixtures/preset/rejected.txt' 1 'refused fixture'
          Invoke-Preset 'tests/fixtures/preset/no-such-file.txt' 1 'name that opens nothing'
          $oversized = Join-Path $env:RUNNER_TEMP 'oversized-preset.txt'
          $text = [IO.File]::ReadAllText($accepted)
          [IO.File]::WriteAllText($oversized, $text + ("`n" * (8193 - $text.Length)))
          Invoke-Preset $oversized 1 'one byte past the read cap'

      - name: Test (conformance harness)
        # Locked-mode restore: a dependency drifting from the committed lock
        # file fails the build instead of floating silently.
        #
        # `--project` rather than a bare path, and no `--nologo`. Under the
        # opt-in that global.json now declares, `dotnet test` is the
        # Microsoft.Testing.Platform command rather than the VSTest one, and it
        # takes the project as a named option; a bare path is not an error
        # there, it is an argument the command ignores, and the run reports
        # "no tests were run" with exit code 5. Measured while landing #343:
        # the same tree runs 455 tests with the option and 0 without it.
        run: dotnet test --project tests/Swarm.Tests/Swarm.Tests.csproj -c Release -p:RestoreLockedMode=true

      - name: Build the micro-bench (compile-check only)
        # The benchmark is run by hand - timing numbers never gate CI (flake).
        # This step only keeps it compiling against the kernel P/Invoke surface
        # so it cannot rot between the manual runs recorded in docs/BENCHMARKS.md.
        run: dotnet build tests/Swarm.Bench/Swarm.Bench.csproj -c Release --nologo

      - name: Check formatting (Prettier)
        # Exact-pinned: a floating tag would let a prettier minor change
        # formatting and break the gate with zero repo change, invisible to
        # Dependabot (no npm manifest). Same pin as the local gate; bumped
        # deliberately.
        run: npx --yes prettier@3.9.5 --check "**/*.{md,yml,yaml}"

# Static analysis of the GitHub Actions supply-chain config (zizmor): the
# workflow YAML and - because the runs below collect over `.`, not over
# .github/workflows/ alone - the Dependabot config too; zizmor's
# dependabot-cooldown audit is what forced .github/dependabot.yml's cooldown
# blocks. The workflow YAML is itself part of the supply-chain surface this
# repo pins against (SECURITY.md: the toolchain bootstrap and all CI actions
# are pinned to exact hashes); this gate is what enforces that invariant
# automatically instead of relying on a reviewer to eyeball every `uses:`
# line, and it will catch the release/publish workflow's `contents: write`
# grant once that pipeline exists (docs/internal only today; release-prep is a
# placeholder).
#
# The gate runs zizmor's regular persona at --min-severity=low: it fails the
# build on any actionable (low/medium/high/critical) security finding --
# template-injection, cache-poisoning, dangerous-triggers, excessive-permissions,
# unpinned-uses, etc. -- and uploads that same set to the code-scanning tab. The
# regular persona is the one zizmor documents for CI ("high-signal, low-noise,
# actionable"). The pedantic persona is deliberately NOT used to gate: it adds
# low-severity hygiene findings (undocumented permissions, missing concurrency,
# pin-comment mismatches, unnamed jobs) that are stylistic, not security-blocking.
#
# Rule for future workflow changes: every new or edited workflow must pass this
# gate before merge. Keep actions SHA-pinned, keep checkout on
# persist-credentials:false, grant write permissions per job (never
# workflow-level), and never restore a cache in a job that publishes a release.
# A step that runs zizmor keeps its GitHub API token: five of zizmor's audits
# are online-only and skip without one, reporting the same findings while
# checking less (#189, measured on the runner, detail at the env block below).
# An action that installs a third-party tool must pin the TOOL as well as the
# action: zizmor 1.26.1's unpinned-tools audit knows exactly two such actions
# (aquasecurity/setup-trivy, 1password/load-secrets-action) and setup-uv is not
# one of them, so that half is refused by PinnedToolInstallTests in the .NET
# harness rather than by this gate.
#
# The audit and the upload are two jobs on purpose (#193). secrets.GITHUB_TOKEN
# is minted with the permissions of the job it is read in, so while one job held
# security-events: write for the SARIF upload, the token handed to the steps
# that fetch and execute a third-party wheel could write code-scanning results.
# Those are the steps with the widest ingestion surface and the least need for a
# write grant. The audit job now holds contents: read and passes results.sarif
# to the upload job as an artifact; the upload job holds the write grant and
# runs no third-party executable. ZizmorJobPermissionTests refuses putting them
# back together.
name: Workflow Security Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

# Explicit deny-all at workflow level; the job below grants only what it needs.
permissions: {}

# Cancel a superseded run on the same ref so a new push / PR update does not
# queue behind an obsolete scan. This is an audit job, not a publish, so
# cancelling a superseded run is safe.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Audit workflows (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # No security-events: write here. This job downloads and executes a
      # third-party wheel, and secrets.GITHUB_TOKEN is minted with the
      # permissions of the job that reads it (#193).
      contents: read # checkout the workflows to scan
    env:
      ZIZMOR_VERSION: "1.26.1"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # SHA-pinning the action above pins the action, not the executable it
          # downloads. This input defaults to the empty string, documented as
          # "Defaults to the version in pyproject.toml or 'latest'", and this
          # repo has no pyproject.toml, uv.toml, uv.lock, .tool-versions or
          # requirements.txt. Without this line uv therefore resolves to latest
          # on every run, in the job that fetches and executes the audit tool.
          # That job no longer holds security-events: write (#193), which
          # narrows what a bad resolve could reach but does not make it fine.
          # Everything else here is pinned: actions by commit SHA, FASM by
          # SHA-256, zizmor and prettier by exact version. Delete this line and
          # that hole reopens.
          #
          # 0.11.30 is a choice, not whatever latest was the day this was
          # written: it is the newest uv that the setup-uv commit pinned above
          # carries a built-in checksum for, so the checksum below is a second
          # opinion on a download the action would verify anyway rather than the
          # only one. Moving past 0.11.30 gives that fallback up, so bump the two
          # lines together and check the action's table first.
          version: "0.11.30"
          # A version pin on its own still trusts whatever the mirror serves, so
          # name the bytes as well. A supplied checksum replaces the action's
          # built-in table entry instead of adding to it, so a stale value here
          # fails the job closed. This is the SHA-256 of
          # uv-x86_64-unknown-linux-gnu.tar.gz for 0.11.30, the only artifact
          # this ubuntu-latest job downloads: if runs-on ever moves to another
          # platform the hash stops matching and the job fails, which is the
          # wanted behaviour and not a bug.
          checksum: "04bc7d180d6138bf6dc08387acf507a823f397a98fea55da36b0ccc7fbce3b68"
          # v9 flipped this default to false. Measured on this repo: the saved
          # cache went from 79,677 bytes to 8,631,282 and started retaining the
          # pinned zizmor wheel, on a key the action documents as never
          # invalidating. That cache is restored into the job that then executes
          # the wheel, which is why it is pinned shut whatever the job's grants.
          # Pinned true so the major bump changes no behaviour here.
          prune-cache: true

      - name: Audit workflows (SARIF for code scanning)
        # --no-build: install zizmor from its prebuilt wheel only, never executing a
        # source-dist build script. --strict-collection: fail closed if any workflow
        # fails to parse, so a malformed/tampered file cannot slip past the audit.
        # --format=sarif always exits 0; the gate step below is what fails the build.
        run: uvx --no-build "zizmor@${ZIZMOR_VERSION}" --strict-collection --min-severity=low --format=sarif . > results.sarif
        env:
          # Measured on the runner rather than read from the docs (#189).
          # Without a token this command still exits 0 and reports exactly the
          # same findings, so dropping the token looks like a free hardening.
          # At -v the registry says what it actually did: "skipping
          # impostor-commit / ref-confusion / known-vulnerable-actions /
          # stale-action-refs / ref-version-mismatch: can't run without a
          # GitHub API token", five audits gone, and the count of skips goes
          # from 5 to 0 when the token is put back. All five reason about the
          # `uses:` refs this repo pins by SHA, which is most of what this gate
          # exists to check, so a token-less run is a gate that passes by
          # auditing less. The token stays, on the two steps that run zizmor and
          # on nothing else in this job. ZizmorTokenTests refuses its removal.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Hand the SARIF to the upload job
        # Before the gate step below, not after, so a run that FINDS something
        # still puts its findings in the code-scanning tab. That was the step
        # order inside the single job and it is preserved here by ordering plus
        # the upload job's `!cancelled()`.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zizmor-sarif
          path: results.sarif
          retention-days: 1
          # Fail closed: no SARIF means the upload job would silently have
          # nothing to publish, which is the "quietly stops uploading" outcome
          # #193 names as worse than the exposure it removes.
          if-no-files-found: error

      - name: Fail on actionable findings
        run: uvx --no-build "zizmor@${ZIZMOR_VERSION}" --strict-collection --min-severity=low --format=plain .
        env:
          # Same measurement, same reason as the step above (#189): without it
          # five audits skip and this gate passes on less. This is the step that
          # fails the build, so it is the one where a silently narrowed audit
          # costs the most.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload:
    name: Upload the zizmor SARIF
    needs: zizmor
    # The same condition the upload step carried inside the single job: only
    # where the GITHUB_TOKEN can write security events, i.e. pushes to main and
    # same-repo human PRs. Fork and Dependabot pull requests run with a
    # read-only token, so this job is skipped there and the gate in the audit
    # job still runs and still blocks on findings.
    #
    # !cancelled() rather than the default success(): the audit job FAILS when
    # it finds something, and that is exactly the run whose findings belong in
    # the tab.
    if: |
      !cancelled() &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login != 'dependabot[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      security-events: write # upload the SARIF into the code-scanning tab
      contents: read # upload-sarif reads the checkout to resolve the commit
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the SARIF
        # continue-on-error on both steps here is what the single upload step's
        # continue-on-error did: a transient code-scanning failure must not
        # change the verdict the audit job already reached.
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zizmor-sarif

      - name: Upload SARIF
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@d1ba80a13dd99fba24a470575428917156a28b43 # v4.37.5
        with:
          sarif_file: results.sarif
          category: zizmor
